<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex City Web Edition - محاكي المدينة</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #ff9800; }
        p { margin: 5px 0; font-size: 14px; color: #ccc; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Flex City Web</h1>
        <p>السرعة: <span id="speed">0</span> كم/س</p>
    </div>

    <div id="controls-hint">
        استخدم أزرار <b>W A SD</b> أو الأسهم للتحكم بالسيارة في المدينة!
    </div>

    <!-- استدعاء مكتبة الرسوميات Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. إعداد المشهد والكاميرا والمحرك
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // لون السماء
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // 3. إنشاء الأرضية (الشارع)
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 4. بناء المباني العشوائية لتمثيل شوارع المدينة
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x555577 });
        for (let i = -200; i <= 200; i += 40) {
            for (let j = -200; j <= 200; j += 40) {
                if (Math.abs(i) < 20 || Math.abs(j) < 20) continue; // ترك مساحة للشارع الرئيسي
                const height = Math.random() * 40 + 10;
                const bGeo = new THREE.BoxGeometry(25, height, 25);
                const building = new THREE.Mesh(bGeo, buildingMat);
                building.position.set(i, height / 2, j);
                scene.add(building);
            }
        }

        // 5. بناء السيارة
        const carGroup = new THREE.Group();
        
        // هيكل السيارة
        const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3b30 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.7;
        carGroup.add(carBody);

        // سقف السيارة
        const roofGeo = new THREE.BoxGeometry(1.6, 0.8, 2);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const carRoof = new THREE.Mesh(roofGeo, roofMat);
        carRoof.position.set(0, 1.4, -0.2);
        carGroup.add(carRoof);

        scene.add(carGroup);

        // 6. متغيرات التحكم والحركة
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let carPosition = { x: 0, z: 0 };
        let carRotation = 0;
        let speed = 0;
        const maxSpeed = 0.8;
        const acceleration = 0.02;
        const deceleration = 0.015;

        // 7. حلقة اللعبة الرئيسية (Animation & Physics Loop)
        function animate() {
            requestAnimationFrame(animate);

            // التحكم بالسرعة للأمام والخلف
            if (keys['w'] || keys['arrowup']) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys['s'] || keys['arrowdown']) {
                speed = Math.max(speed - acceleration, -maxSpeed / 2);
            } else {
                if (speed > 0) speed = Math.max(0, speed - deceleration);
                if (speed < 0) speed = Math.min(0, speed + deceleration);
            }

            // التحكم بالانعطاف لليمين واليسار
            if (keys['a'] || keys['arrowleft']) {
                if (Math.abs(speed) > 0.05) carRotation += speed * 0.05;
            }
            if (keys['d'] || keys['arrowright']) {
                if (Math.abs(speed) > 0.05) carRotation -= speed * 0.05;
            }

            // تحديث إحداثيات موقع السيارة
            carPosition.x += Math.sin(carRotation) * speed;
            carPosition.z += Math.cos(carRotation) * speed;

            carGroup.position.set(carPosition.x, 0, carPosition.z);
            carGroup.rotation.y = carRotation;

            // تحديث عداد السرعة في الواجهة
            document.getElementById('speed').innerText = Math.round(Math.abs(speed) * 120);

            // تحريك الكاميرا وخلف السيارة تماماً
            camera.position.x = carPosition.x - Math.sin(carRotation) * 10;
            camera.position.z = carPosition.z - Math.cos(carRotation) * 10;
            camera.position.y = carGroup.position.y + 5;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // التجاوب مع تغيير حجم نافذة المتصفح
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
